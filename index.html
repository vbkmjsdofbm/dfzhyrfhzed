<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测一测，TA 是不是也在偷偷喜欢你</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23D93A57'/><path d='M16 25.5c-1-1.2-8-6.2-8-11.1 0-2.7 2.1-4.6 4.5-4.6 1.6 0 2.9.8 3.5 2 .6-1.2 1.9-2 3.5-2 2.4 0 4.5 1.9 4.5 4.6 0 4.9-7 9.9-8 11.1z' fill='%23F7F5EE'/></svg>">
<style>
:root{
  --paper:#E8E4D8;
  --sheet:#F7F5EE;
  --ink:#1E2118;
  --ink-2:#5B5D53;
  --line:#CFCBBA;
  --red:#D93A57;
  --red-2:#A82A42;
  --yellow:#F2C64D;
  --serif:"Songti SC","SimSun","宋体",Georgia,serif;
  --hei:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",sans-serif;
  --kai:"Kaiti SC","KaiTi","STKaiti","楷体",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:16px 12px 44px;color:var(--ink);
  font-family:var(--hei);font-size:15px;line-height:1.7;
  background-color:var(--paper);
  background-image:radial-gradient(circle at 14% -6%,#F4F1E7 0%,rgba(244,241,231,0) 58%),radial-gradient(circle at 86% 104%,#DFDACB 0%,rgba(223,218,203,0) 62%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  position:relative;max-width:720px;margin:0 auto;background:var(--sheet);
  border:1px solid var(--line);padding:22px 18px 28px;
  box-shadow:inset 0 1px 0 #fff, 0 22px 48px -30px rgba(30,33,24,.55);
}
.sheet::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.03;
  background-image:radial-gradient(#1E2118 0.5px, transparent 0.5px);
  background-size:3px 3px;
}
.seal{display:none}
.screen{display:none}
.screen.is-on{display:block;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen.is-on{animation:none}
  *{transition:none !important}
}

/* ---------- 抬头 ---------- */
.meta{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--kai);font-size:12.5px;color:var(--ink-2);
  padding-bottom:9px;border-bottom:1px solid var(--line);
}
.fields{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-family:var(--kai);font-size:12.5px;color:var(--ink-2)}
.field{display:flex;align-items:flex-end;gap:6px}
.blank{display:inline-block;width:56px;height:15px;border-bottom:1px dotted #B6B2A1}

h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(27px,7.6vw,50px);
  line-height:1.26;letter-spacing:-.02em;margin:18px 0 0;
}
.mark{background:linear-gradient(180deg,transparent 60%,var(--yellow) 60%,rgba(242,198,77,.85) 94%,transparent 94%);padding:0 3px}
.sub{font-family:var(--kai);font-size:15px;color:var(--ink-2);margin:14px 0 0;letter-spacing:.02em}
.sub::before{content:"";display:inline-block;width:16px;height:1px;background:var(--red);vertical-align:middle;margin-right:8px}

/* ---------- 卖点 ---------- */
.sell{display:grid;grid-template-columns:1fr;gap:9px;margin:24px 0 26px}
@media(min-width:560px){.sell{grid-template-columns:1fr 1fr}}
.card{
  display:flex;gap:10px;align-items:flex-start;
  padding:11px 12px;background:#FBFAF4;border:1px solid var(--line);
}
.card svg{flex:0 0 24px;width:24px;height:24px;margin-top:2px}
.card svg circle{fill:none;stroke:var(--line);stroke-width:1.4}
.card svg path{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card p{margin:0;font-size:14px;line-height:1.6}
.card b{font-weight:600;letter-spacing:.03em}
.card .sep{color:#B0AC9B;margin:0 1px}

/* ---------- 按钮 ---------- */
.btn-primary{
  display:block;width:100%;border:0;border-radius:2px;cursor:pointer;
  background:var(--red);color:#fff;font-family:var(--hei);font-size:17px;font-weight:600;
  letter-spacing:.1em;padding:15px 18px;
  box-shadow:4px 4px 0 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn-primary:hover{background:#E24563}
.btn-primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 var(--ink)}
.btn-ghost{
  display:inline-block;border:1px solid var(--ink);background:transparent;border-radius:2px;cursor:pointer;
  color:var(--ink);font-family:var(--hei);font-size:14px;padding:11px 18px;min-height:44px;
  transition:background .12s ease;
}
.btn-ghost:hover{background:#EFEBDE}
.btn-ghost:disabled{opacity:.35;cursor:default}
.tiny{font-family:var(--kai);font-size:12.5px;color:var(--ink-2);margin:16px 0 0;text-align:center;letter-spacing:.04em}

/* ---------- 答题 ---------- */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.qmeta{font-family:var(--serif);font-size:13px;color:var(--red);letter-spacing:.1em;white-space:nowrap}
.dots{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;flex:1;max-width:240px}
.dot{aspect-ratio:1;border:1px solid #C6C2B1;background:transparent}
.dot.on{background:var(--red);border-color:var(--red)}
.dot.cur{border-color:var(--ink);border-width:2px}
.bar-line{height:2px;background:var(--line);margin:10px 0 20px}
.bar-line i{display:block;height:100%;width:0;background:var(--red);transition:width .3s ease}
.qnum{font-family:var(--kai);font-size:12.5px;color:var(--ink-2);letter-spacing:.12em;margin:0}
.stem{
  font-family:var(--serif);font-weight:600;font-size:clamp(19px,5.2vw,26px);
  line-height:1.5;letter-spacing:-.01em;margin:10px 0 20px;
}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:12px;align-items:center;width:100%;min-height:58px;
  padding:13px 13px;text-align:left;cursor:pointer;
  background:#FBFAF4;border:1px solid var(--line);border-radius:2px;
  font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink);
  transition:background .14s ease,border-color .14s ease;
}
.opt:hover{border-color:#9C9A88;background:#FFFDF6}
.opt .key{
  flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;
  border:1px solid #9C9A88;border-radius:50%;
  font-family:var(--hei);font-size:12px;font-weight:700;color:var(--ink-2);
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.opt.sel{border-color:var(--red);background:#FBEDF0}
.opt.sel .key{background:var(--red);border-color:var(--red);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.hint{font-family:var(--kai);font-size:12.5px;color:var(--ink-2)}

/* ---------- 结果 ---------- */
.result-head{position:relative;padding-right:92px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.stamp{
  position:absolute;right:0;top:2px;width:86px;height:86px;border-radius:50%;
  border:2.5px solid var(--red);outline:1px solid var(--red);outline-offset:-7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--red);font-family:var(--kai);font-size:12px;line-height:1.2;
  transform:rotate(-11deg);opacity:.9;mix-blend-mode:multiply;
  animation:stampIn .46s cubic-bezier(.2,.9,.3,1.5) both;
}
@keyframes stampIn{
  0%{opacity:0;transform:rotate(-4deg) scale(1.9)}
  60%{opacity:1;transform:rotate(-13deg) scale(.94)}
  100%{opacity:.9;transform:rotate(-11deg) scale(1)}
}
.result-head .qnum{margin:0 0 6px}
.res-name{font-family:var(--serif);font-weight:700;font-size:clamp(24px,6.4vw,36px);line-height:1.3;letter-spacing:-.02em;margin:0}
.res-sub{font-family:var(--kai);font-size:14.5px;color:var(--red-2);margin:5px 0 0;letter-spacing:.03em}
.scoreline{display:flex;align-items:baseline;gap:7px;margin:12px 0 0}
.score-big{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1;letter-spacing:-.03em}
.scoreunit{font-family:var(--hei);font-size:12.5px;color:var(--ink-2);letter-spacing:.06em}
.persona{
  font-family:var(--kai);font-size:15.5px;line-height:1.72;margin:20px 0 0;color:var(--ink);
  padding:12px 0 0;border-top:1px dashed var(--line);
}
.read{font-family:var(--serif);font-size:15px;line-height:1.86;margin:14px 0 0;color:#2B2E22}
.blocktitle{
  font-family:var(--hei);font-size:12.5px;font-weight:600;color:var(--ink-2);
  letter-spacing:.14em;margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:flex;gap:9px;font-size:14.5px;font-family:var(--serif);line-height:1.7;margin:0 0 7px}
.ev li span{flex:0 0 5px;width:5px;height:5px;background:var(--red);margin-top:10px}
.note{border-top:1px dashed var(--line);padding-top:11px;margin-top:15px}
.note h3{font-family:var(--kai);font-size:13.5px;margin:0 0 3px;letter-spacing:.1em;color:var(--red)}
.note p{font-family:var(--kai);font-size:14.5px;line-height:1.72;margin:0}
.note.dont h3{color:var(--ink-2)}
.bars{margin-top:4px}
.bar-row{display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .n{font-family:var(--serif);font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{height:9px;background:#E4E0D1;position:relative}
.bar-row .track i{position:absolute;left:0;top:0;bottom:0;background:var(--red);width:0;transition:width .55s ease}
.bar-row .v{font-family:var(--serif);font-size:12.5px;color:var(--ink-2);text-align:right}
.acts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:26px}
@media(min-width:560px){.acts{grid-template-columns:1fr 1fr}}
.more{
  display:block;width:100%;margin-top:16px;padding:11px 0;min-height:44px;
  background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--kai);font-size:13.5px;color:var(--ink-2);letter-spacing:.08em;cursor:pointer;
}
.more:hover{color:var(--ink)}
.allres{display:none}
.allres.open{display:block;margin-top:2px}
.allres dl{margin:0}
.allres dt{
  display:flex;justify-content:space-between;gap:10px;
  font-family:var(--serif);font-size:14px;padding:9px 0 3px;border-top:1px dotted var(--line);
}
.allres dt small{font-family:var(--hei);font-size:11.5px;color:var(--ink-2);letter-spacing:.06em}
.allres dd{margin:0 0 8px;font-family:var(--kai);font-size:13.5px;color:var(--ink-2);line-height:1.6}
.allres dt.hit{color:var(--red)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--ink);color:#F7F5EE;font-size:13.5px;letter-spacing:.04em;
  padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:9;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:768px){
  body{padding:34px 24px 64px}
  .sheet{padding:30px 30px 34px 64px}
  .seal{display:flex;position:absolute;left:0;top:26px;bottom:26px;width:44px;
    border-right:1px dashed #C2BEAD;align-items:center;justify-content:center}
  .seal span{writing-mode:vertical-rl;font-family:var(--kai);font-size:12.5px;
    letter-spacing:.34em;color:#A3A08F;padding-left:4px}
  .result-head{padding-right:118px}
  .stamp{width:104px;height:104px;font-size:13px}
}
</style>
</head>

</main>

/* ================= 逻辑 ================= */
const ORDER = ['r1','r2','r3','r4','r5','r6','r7','r8','r9','r10'];
const PRIORITY = ['r7','r3','r5','r2','r1','r4','r10','r9','r6','r8'];
const LETTER = ['A','B','C','D'];
let answers = new Array(Q.length).fill(null);
let qi = 0, lastKey = null, lastCounts = null;

function $(id){ return document.getElementById(id); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function pageName(){
  var h = location.hash.replace(/^#\/?/, '');
  return h || 'home';
}
function go(p){ location.hash = '#/' + p; }

function showScreen(name){
  var map = {home:'screenHome', quiz:'screenQuiz', result:'screenResult'};
  Object.keys(map).forEach(function(k){
    $(map[k]).classList.toggle('is-on', k === name);
  });
  window.scrollTo(0, 0);
}

function route(){
  var p = pageName();
  if (p === 'quiz'){ showScreen('quiz'); renderQuiz(); }
  else if (p === 'result'){
    if (!lastKey){ go('quiz'); return; }
    showScreen('result'); renderResult();
  } else { showScreen('home'); }
}
window.addEventListener('hashchange', route);

/* 涂卡格 */
(function buildDots(){
  var box = $('dots');
  for (var i = 0; i < Q.length; i++){
    var d = document.createElement('div');
    d.className = 'dot';
    box.appendChild(d);
  }
})();

function paintDots(){
  var cells = $('dots').children;
  for (var i = 0; i < cells.length; i++){
    cells[i].className = 'dot' + (answers[i] ? ' on' : '') + (i === qi ? ' cur' : '');
  }
  var done = answers.filter(function(a){ return a; }).length;
  $('progress').style.width = (done / Q.length * 100).toFixed(1) + '%';
}

function renderQuiz(){
  var cur = Q[qi];
  $('qmeta').textContent = pad(qi + 1) + ' / ' + Q.length;
  $('qnum').textContent = '第 ' + pad(qi + 1) + ' 题　·　单选';
  $('stem').textContent = cur.t;

  var box = $('opts');
  box.innerHTML = '';
  cur.o.forEach(function(o, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (answers[qi] === o[1] ? ' sel' : '');
    var k = document.createElement('span');
    k.className = 'key';
    k.textContent = LETTER[i];
    var t = document.createElement('span');
    t.className = 'lab';
    t.textContent = o[0];
    b.appendChild(k); b.appendChild(t);
    b.addEventListener('click', function(){ pick(o[1]); });
    box.appendChild(b);
  });

  $('prevBtn').disabled = (qi === 0);
  paintDots();
}

function pick(key){
  answers[qi] = key;
  var btns = $('opts').querySelectorAll('.opt');
  var sel = -1;
  Q[qi].o.forEach(function(o, i){ if (o[1] === key) sel = i; });
  for (var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('sel', i === sel);
  }
  paintDots();

  window.setTimeout(function(){
    if (qi < Q.length - 1){
      qi += 1;
      renderQuiz();
      window.scrollTo(0, 0);
    } else {
      finish();
    }
  }, 280);
}

$('prevBtn').addEventListener('click', function(){
  if (qi > 0){ qi -= 1; renderQuiz(); }
});

$('startBtn').addEventListener('click', function(){
  qi = 0;
  answers = new Array(Q.length).fill(null);
  lastKey = null;
  go('quiz');
});

function finish(){
  var counts = {};
  ORDER.forEach(function(k){ counts[k] = 0; });
  answers.forEach(function(k){ if (k) counts[k] += 1; });

  var best = null;
  ORDER.forEach(function(k){
    if (!best || counts[k] > counts[best]) best = k;
  });
  var ties = ORDER.filter(function(k){ return counts[k] === counts[best]; });
  if (ties.length > 1){
    var tail = answers[answers.length - 1];
    best = ties.indexOf(tail) > -1 ? tail : PRIORITY.filter(function(k){ return ties.indexOf(k) > -1; })[0];
  }

  lastKey = best;
  lastCounts = counts;
  go('result');
}

function renderResult(){
  var r = RES[lastKey];
  $('rname').textContent = r.name;
  $('rsub').textContent = r.sub;
  $('rscore').textContent = r.score;
  $('rpersona').textContent = r.persona;
  $('rread').textContent = r.read;
  $('rdo').textContent = r.do;
  $('rdont').textContent = r.dont;

  var list = $('rev');
  list.innerHTML = '';
  r.ev.forEach(function(txt){
    var li = document.createElement('li');
    var dot = document.createElement('span');
    var p = document.createElement('p');
    p.style.margin = '0';
    p.textContent = txt;
    li.appendChild(dot); li.appendChild(p);
    list.appendChild(li);
  });

  /* 落点：真实作答分布的前三 */
  var bars = $('rbars');
  bars.innerHTML = '';
  var top = ORDER.map(function(k){ return {k: k, v: lastCounts[k]}; })
    .sort(function(a, b){ return b.v - a.v; }).slice(0, 3);
  var max = Math.max(1, top[0].v);
  top.forEach(function(item){
    var row = document.createElement('div');
    row.className = 'bar-row';
    var n = document.createElement('span'); n.className = 'n';
    n.textContent = RES[item.k].name;
    var track = document.createElement('span'); track.className = 'track';
    var fill = document.createElement('i');
    track.appendChild(fill);
    var v = document.createElement('span'); v.className = 'v';
    v.textContent = item.v + '/' + Q.length;
    row.appendChild(n); row.appendChild(track); row.appendChild(v);
    bars.appendChild(row);
    window.requestAnimationFrame(function(){
      fill.style.width = (item.v / max * 100) + '%';
    });
  });

  var all = $('allres');
  if (!all.childElementCount){
    var dl = document.createElement('dl');
    ORDER.forEach(function(k){
      var dt = document.createElement('dt');
      var s = document.createElement('span'); s.textContent = RES[k].name;
      var sm = document.createElement('small'); sm.textContent = RES[k].score + ' 分';
      dt.appendChild(s); dt.appendChild(sm);
      var dd = document.createElement('dd');
      dd.textContent = RES[k].sub;
      dt.setAttribute('data-k', k);
      dl.appendChild(dt); dl.appendChild(dd);
    });
    all.appendChild(dl);
  }
  var items = all.querySelectorAll('dt');
  for (var i = 0; i < items.length; i++){
    items[i].classList.toggle('hit', items[i].getAttribute('data-k') === lastKey);
  }
}

/* 再答一次 */
$('againBtn').addEventListener('click', function(){
  qi = 0;
  answers = new Array(Q.length).fill(null);
  lastKey = null;
  go('quiz');
});

/* 复制结果文案 */
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  window.clearTimeout(toast._timer);
  toast._timer = window.setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

$('copyBtn').addEventListener('click', function(){
  var r = RES[lastKey];
  var text = '测一测，TA 是不是也在偷偷喜欢你\n'
    + '我抽到「' + r.name + '」' + r.sub + '，心动指数 ' + r.score + '/100。\n'
    + '你测出来是哪种？\n#心动测试 #暗恋 #暧昧期';
  function done(){ toast('已复制，去发小红书吧'); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，请手动长按选择'); }
    document.body.removeChild(ta);
  }
});

/* 全部结果 */
$('moreBtn').addEventListener('click', function(){
  var open = $('allres').classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
  this.textContent = open ? '收起全部结果' : '查看全部 10 种结果';
});

/* 键盘：1-4 / A-D */
document.addEventListener('keydown', function(e){
  if (pageName() !== 'quiz') return;
  var k = e.key.toUpperCase();
  var i = LETTER.indexOf(k);
  if (i < 0 && ['1','2','3','4'].indexOf(k) > -1) i = ['1','2','3','4'].indexOf(k);
  if (i > -1 && Q[qi].o[i]) pick(Q[qi].o[i][1]);
});

route();
</script>
